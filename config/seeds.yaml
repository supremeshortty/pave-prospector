# Starting accounts, grouped by ICP segment.
# Only `name`, `domain` and `segment` are required. Everything else is discovered:
#   app:   App Store search term, if different from the name
#   cfpb:  text to look up the company's legal name in the CFPB complaint database
#   ats:   job-board slug, if it isn't the domain name (e.g. "greenhouse:hellobrigit")
#   notes: anything worth knowing before outreach
#   warm:  known warm paths (shared lenders, partners, investors) the tool can't find on its own
# Pave's customers, partners and competitors are excluded automatically (config/icp.yaml).

accounts:
